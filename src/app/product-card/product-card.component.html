<div class="row m-0">
    <div class="col-12">
        <div class="card mb-3">
            <div class="card-body" [ngClass]="{
            notAvailable : !gemobileData.isAvailable
         }">
                <div class="row m-0">
                    <div class="col-md-3">
                        <div class="img-container">
                            <img [src]="gemobileData.image" [alt]="gemobileData.name"
                                *ngIf="gemobileData.image; else NoImage">
                            <ng-template #NoImage>
                                <p class="noImgText">
                                    No Image
                                </p>
                            </ng-template>
                        </div>
                    </div>
                    <div class="col-md-7">
                        <h2>
                            {{gemobileData.name}}
                            <small class="badge" [ngClass]="{
                                'badge-success' : gemobileData.rating >= 4,
                                'badge-warning' : gemobileData.rating >= 3 && gemobileData.rating < 4,
                                'badge-danger' : gemobileData.rating < 3
                            }">
                                {{gemobileData.rating}}
                            </small>
                        </h2>
                        <h4 class="text-muted">
                            Features
                        </h4>

                        <ul class="list-group list-group-flush">
                            <li *ngFor="let feature of gemobileData.features" class="list-group-item">{{feature}}</li>
                        </ul>
                        <div class="d-flex justify-content-end mt-3">
                            <button class="btn btn-outline-primary">Add To Cart</button>
                            <button class="btn btn-outline-warning ml-2">Buy Now</button>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <h4>{{(gemobileData.price - gemobileData.price * .15) | currency : 'INR'}}
                            <br>
                            <small>
                                <del>
                                    {{gemobileData.price | currency : 'INR'}}
                                </del>
                            </small>
                        </h4>
                        <strong class="text-success" *ngIf="gemobileData.noOfItems < 10">
                            only {{gemobileData.noOfItems}} left !!!</strong>
                    </div>
                </div>
            </div>
            <p class="isAvailable" *ngIf="!gemobileData.isAvailable">
                Product is not available
            </p>
        </div>
    </div>
</div>
